// Groovy DSL consumer of the ENZONA Java SDK.
plugins {
    id 'java'
    id 'application'
}

repositories {
    // The SDK is published on Maven Central: no other repository is needed.
    // To try unreleased changes, run `./mvnw install -DskipTests` and add mavenLocal() above mavenCentral().
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation "io.github.alejo2075:enzona-sdk:${enzonaVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'example.PaymentDemo'
}

tasks.named('test') {
    useJUnitPlatform()
}
